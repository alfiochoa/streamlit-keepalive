name: keep-streamlit-apps-awake
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; Streamlit hibernates apps after ~12h without traffic
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  db-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]==3.2.3"
      - run: python db_ping.py
        env: { SUPABASE_DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }
  td-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python td_usage.py
        env: { TWELVE_DATA_API_KEY: "${{ secrets.TWELVE_DATA_API_KEY }}" }
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.49.1 && playwright install --with-deps chromium
      - run: python keepalive.py
      # GitHub disables scheduled workflows after 60 days without repo activity: commit a heartbeat on Mondays.
      - name: heartbeat commit
        if: always()
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            date -u +"last run: %Y-%m-%dT%H:%MZ" > heartbeat.txt
            git config user.name "keepalive-bot"; git config user.email "keepalive-bot@users.noreply.github.com"
            git add heartbeat.txt; git commit -m "chore: heartbeat" || true; git push || true
          fi
